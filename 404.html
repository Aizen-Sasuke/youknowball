<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — YouKnowBall</title>
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#07130d;color:#f4f1e6;font:500 17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{text-align:center;padding:24px}
  h1{display:inline-block;margin:0 0 18px;padding:.05em .3em .02em .14em;font:800 clamp(40px,12vw,84px)/.95 "Arial Narrow",system-ui,sans-serif;text-transform:uppercase;color:#0b1d13;background:#e6e0cb;clip-path:polygon(0 0,100% 0,calc(100% - .2em) 100%,0 100%)}
  p{margin:0 0 24px;color:#a3b9a9}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;font-weight:700;background:#e6e0cb;color:#0b1d13;text-decoration:none;border-radius:3px}
</style>
</head>
<body>
<main>
<h1>Off target</h1>
<p>That page does not exist. The game is one tap away.</p>
<!-- Relative link: resolves to the site root on both GitHub Pages /youknowball/ and a Vercel deployment root -->
<a href="./">Play YouKnowBall</a>
</main>
<script>
// On GitHub Pages the site lives in /youknowball/. From a nested 404 URL the
// relative "./" would stay one level too deep, so compute that base from the
// current location (works unchanged on a Vercel deploy at the domain root).
const i = location.pathname.indexOf("/youknowball/");
if (i >= 0) location.replace(location.origin + location.pathname.slice(0, i + "/youknowball/".length));
</script>
</body>
</html>
